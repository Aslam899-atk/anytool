<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator - AnyTool.io</title>
    <meta name="description" content="Generate high quality custom QR codes for free. Supports links, text, WiFi, and more. Instant download.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center space-x-2 text-indigo-600 hover:text-indigo-700">
                    <span class="text-2xl font-black tracking-tight">AnyTool<span class="text-pink-500">.io</span></span>
                </a>
                <div class="flex space-x-4">
                    <a href="/qr-scanner.html" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800">
                        Scan / Read QR →
                    </a>
                    <a href="/" class="text-sm font-semibold text-gray-600 hover:text-indigo-600">
                        ← All Tools
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-10 px-4 text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold mb-3">Free QR Code Generator</h1>
        <p class="text-blue-100 max-w-xl mx-auto text-sm sm:text-base">
            Create high-resolution custom QR codes instantly. Enter any URL or text, customize colors, and download as PNG.
        </p>
    </header>

    <!-- Main Tool Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-10 flex-grow w-full">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 sm:p-10 grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left: Inputs -->
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Enter Content / URL</label>
                    <textarea id="qrText" rows="4" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="https://example.com or any text message...">https://anytool.io</textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">QR Color</label>
                        <input id="fgColor" type="color" value="#000000" class="w-full h-10 p-1 border border-gray-300 rounded-lg cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Background Color</label>
                        <input id="bgColor" type="color" value="#ffffff" class="w-full h-10 p-1 border border-gray-300 rounded-lg cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Image Size (px)</label>
                    <select id="qrSize" class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white">
                        <option value="200">200 x 200 (Standard)</option>
                        <option value="300" selected>300 x 300 (High Quality)</option>
                        <option value="500">500 x 500 (Print Quality)</option>
                    </select>
                </div>

                <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Update QR Code
                </button>
            </div>

            <!-- Right: Preview & Download -->
            <div class="flex flex-col items-center justify-center bg-gray-50 rounded-2xl border border-dashed border-gray-300 p-6">
                <div id="qrcode" class="p-3 bg-white rounded-xl shadow-sm border border-gray-200"></div>

                <div class="mt-6 flex flex-col w-full max-w-xs space-y-3">
                    <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl shadow transition flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download PNG
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500 mt-12">
        <p>© 2026 AnyTool.io • Zero Data Retention • 100% Free</p>
    </footer>

    <script>
        const qrContainer = document.getElementById("qrcode");
        let qrcodeObj = null;

        function renderQR() {
            qrContainer.innerHTML = "";
            const text = document.getElementById("qrText").value.trim() || "https://anytool.io";
            const size = parseInt(document.getElementById("qrSize").value);
            const fg = document.getElementById("fgColor").value;
            const bg = document.getElementById("bgColor").value;

            qrcodeObj = new QRCode(qrContainer, {
                text: text,
                width: size,
                height: size,
                colorDark: fg,
                colorLight: bg,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        document.getElementById("generateBtn").addEventListener("click", renderQR);
        document.getElementById("qrText").addEventListener("input", renderQR);
        document.getElementById("fgColor").addEventListener("change", renderQR);
        document.getElementById("bgColor").addEventListener("change", renderQR);
        document.getElementById("qrSize").addEventListener("change", renderQR);

        // Download PNG
        document.getElementById("downloadBtn").addEventListener("click", () => {
            const img = qrContainer.querySelector("img");
            if (img && img.src) {
                const link = document.createElement("a");
                link.download = "anytool-qrcode.png";
                link.href = img.src;
                link.click();
            } else {
                const canvas = qrContainer.querySelector("canvas");
                if (canvas) {
                    const link = document.createElement("a");
                    link.download = "anytool-qrcode.png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                }
            }
        });

        // Initial render
        renderQR();
    </script>
</body>
</html>
