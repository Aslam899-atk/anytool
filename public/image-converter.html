<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Image Converter & Compressor - Convert JPG, PNG, WEBP | AnyTool</title>
    <meta name="description" content="Convert and compress images (JPG, PNG, WEBP) directly in your browser. 100% free, high quality, and completely private with zero server uploads.">
    <meta name="keywords" content="image converter, compress image, convert jpg to png, convert png to webp, free image resizer, image compressor online">
    <link rel="canonical" href="https://anytool.io/image-converter">

    <!-- Schema.org WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AnyTool Image Converter & Compressor",
      "url": "https://anytool.io/image-converter",
      "description": "Convert and compress JPG, PNG, and WEBP images in browser with adjustable quality percentage.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center space-x-2 text-indigo-600 hover:text-indigo-700">
                    <span class="text-2xl font-black tracking-tight">AnyTool<span class="text-pink-500">.io</span></span>
                </a>
                <div class="flex space-x-4">
                    <a href="/bg-remover.html" class="text-sm font-semibold text-purple-600 hover:text-purple-800">
                        BG Remover →
                    </a>
                    <a href="/" class="text-sm font-semibold text-gray-600 hover:text-indigo-600">
                        ← All Tools
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-gradient-to-r from-cyan-600 to-blue-600 text-white py-10 px-4 text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold mb-3">Image Converter & Compressor</h1>
        <p class="text-cyan-100 max-w-xl mx-auto text-sm sm:text-base">
            Compress and convert photos between JPG, PNG, and WEBP formats with instant download.
        </p>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10 flex-grow w-full">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 sm:p-10 space-y-6">
            <!-- Dropzone -->
            <div id="dropzone" class="border-2 border-dashed border-cyan-300 rounded-2xl p-8 text-center hover:border-cyan-500 transition cursor-pointer bg-cyan-50/40" onclick="document.getElementById('imageInput').click()">
                <svg class="w-12 h-12 text-cyan-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p id="uploadLabel" class="text-base font-bold text-gray-800">Click to upload image</p>
                <p class="text-xs text-gray-500 mt-1">Processed 100% locally in your browser</p>
                <input type="file" id="imageInput" accept="image/*" class="hidden">
            </div>

            <!-- Conversion Options -->
            <div id="converterOptions" class="hidden space-y-6 border-t border-gray-200 pt-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Target Format</label>
                        <select id="targetFormat" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white">
                            <option value="image/jpeg">JPG / JPEG</option>
                            <option value="image/png">PNG</option>
                            <option value="image/webp" selected>WEBP (Best compression)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Quality: <span id="qualityVal" class="text-cyan-600">80%</span></label>
                        <input id="qualitySlider" type="range" min="10" max="100" value="80" class="w-full h-2 bg-gray-200 rounded-lg cursor-pointer accent-cyan-600">
                    </div>
                </div>

                <div class="text-center">
                    <button id="convertBtn" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3.5 px-8 rounded-xl text-base shadow-lg transition inline-flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Convert & Download
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500 mt-12">
        <p>© 2026 AnyTool.io • Zero Data Retention • 100% Free</p>
    </footer>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadLabel = document.getElementById('uploadLabel');
        const converterOptions = document.getElementById('converterOptions');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityVal = document.getElementById('qualityVal');
        const targetFormat = document.getElementById('targetFormat');
        const convertBtn = document.getElementById('convertBtn');

        let loadedImage = new Image();
        let fileName = 'image';

        qualitySlider.addEventListener('input', (e) => {
            qualityVal.innerText = `${e.target.value}%`;
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length === 0) return;
            const file = e.target.files[0];
            fileName = file.name.substring(0, file.name.lastIndexOf('.')) || 'image';
            uploadLabel.innerText = `Selected: ${file.name}`;

            const reader = new FileReader();
            reader.onload = (event) => {
                loadedImage.onload = () => {
                    converterOptions.classList.remove('hidden');
                };
                loadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        convertBtn.addEventListener('click', () => {
            if (!loadedImage.src) return;

            const canvas = document.createElement('canvas');
            canvas.width = loadedImage.width;
            canvas.height = loadedImage.height;
            const ctx = canvas.getContext('2d');

            const mime = targetFormat.value;
            if (mime === 'image/jpeg') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.drawImage(loadedImage, 0, 0);

            const quality = parseInt(qualitySlider.value) / 100;
            const dataUrl = canvas.toDataURL(mime, quality);

            const extMap = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
            const ext = extMap[mime] || 'png';

            const link = document.createElement('a');
            link.download = `${fileName}_converted.${ext}`;
            link.href = dataUrl;
            link.click();
        });
    </script>
</body>
</html>
